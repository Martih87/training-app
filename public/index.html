<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LightWeight!</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #000;
      color: #fff;
      font-family: 'Lexend', sans-serif;
      min-height: 100vh;
    }

    .landing {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      overflow: hidden;
      position: relative;
      background: #000;
      padding-top: 0;
    }

    .landing::before,
    .landing::after {
      content: "";
      position: absolute;
      pointer-events: none;
      z-index: 0;
    }

    .landing::before {
      inset: 0;
      background:
        radial-gradient(ellipse 58% 22% at 50% 56%, rgba(255, 90, 0, 0.1) 0%, rgba(215, 70, 0, 0.08) 28%, rgba(120, 28, 0, 0.04) 52%, rgba(0, 0, 0, 0) 78%),
        radial-gradient(ellipse 38% 18% at 50% 76%, rgba(255, 103, 0, 0.08) 0%, rgba(140, 40, 0, 0.04) 45%, rgba(0, 0, 0, 0) 82%);
      filter: blur(2px);
    }

    .landing::after {
      left: 50%;
      top: 60%;
      transform: translateX(-50%);
      width: min(90vw, 560px);
      height: 56%;
      background: radial-gradient(ellipse at center, rgba(255, 93, 0, 0.15) 0%, rgba(197, 54, 0, 0.08) 34%, rgba(0, 0, 0, 0) 76%);
      filter: blur(16px);
      opacity: 0.58;
    }

    .landing > * {
      position: relative;
      z-index: 1;
    }

    /* ══════════════════════════════════════════
       DRAGON IMAGE HERO
       ══════════════════════════════════════════ */
    .dragon-hero {
      position: relative;
      width: 100%;
      max-width: 540px;
      margin-bottom: 0;
      padding: 0 1rem;
    }

    .dragon-hero img {
      width: 100%;
      height: auto;
      display: block;
      /* Feather-blend the edges into the black background */
      mask-image: radial-gradient(ellipse 86% 74% at 50% 42%, #000 40%, transparent 74%);
      -webkit-mask-image: radial-gradient(ellipse 86% 74% at 50% 42%, #000 40%, transparent 74%);
    }

    /* Subtle pulsing fire glow behind the image */
    .dragon-hero::before {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 95%;
      height: 140%;
      background: radial-gradient(ellipse at center, rgba(255, 109, 0, 0.16) 0%, rgba(210, 75, 0, 0.12) 34%, rgba(112, 29, 0, 0.06) 63%, transparent 80%);
      pointer-events: none;
      filter: blur(7px);
      animation: glow-breathe 3.8s ease-in-out infinite;
      z-index: 1;
    }

    @keyframes glow-breathe {
      0%, 100% { opacity: 0.6; transform: translate(-50%, -50%) scale(1); }
      50%      { opacity: 1; transform: translate(-50%, -50%) scale(1.05); }
    }

    /* ══════════════════════════════════════════
       TITLE
       ══════════════════════════════════════════ */
    .app-title {
      font-size: clamp(2.2rem, 10vw, 3.25rem);
      font-weight: 800;
      letter-spacing: 1.4px;
      text-transform: uppercase;
      background: linear-gradient(180deg, #ffd58f 0%, #ffa538 34%, #f06700 64%, #ce4300 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 0 14px rgba(255, 122, 24, 0.42));
      margin-top: -0.2rem;
      margin-bottom: 0.35rem;
      animation: title-pulse 3s ease-in-out infinite;
    }

    @keyframes title-pulse {
      0%, 100% { filter: drop-shadow(0 0 20px rgba(255,120,0,0.4)); }
      50%      { filter: drop-shadow(0 0 35px rgba(255,120,0,0.7)); }
    }

    .subtitle {
      font-size: clamp(0.86rem, 2.6vw, 1.05rem);
      font-weight: 700;
      color: rgba(255, 201, 119, 0.86);
      letter-spacing: 0.8px;
      text-transform: uppercase;
      margin-bottom: 0.15rem;
      text-shadow: 0 0 10px rgba(255, 126, 22, 0.32);
    }

    .tagline {
      font-size: clamp(0.72rem, 2.15vw, 0.83rem);
      font-weight: 500;
      color: rgba(240, 233, 223, 0.8);
      letter-spacing: 0;
      margin-bottom: 1.45rem;
    }

    /* ══════════════════════════════════════════
       SIGN-IN BOX
       ══════════════════════════════════════════ */
    .signin-box {
      background: transparent;
      border: 0;
      padding: 0;
      width: min(90vw, 300px);
    }

    .signin-box p {
      display: none;
    }

    .signin-box .loading-msg {
      color: rgba(255, 187, 120, 0.86);
      font-size: 0.92rem;
    }

    #google-btn {
      width: 100%;
    }

    .google-signin-btn {
      width: 100%;
      border: 1px solid rgba(255, 180, 120, 0.58);
      border-radius: 8px;
      min-height: 44px;
      font-family: "Lexend", sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      color: #ffeedc;
      background: linear-gradient(180deg, #ff9f3f 0%, #ff7a1f 48%, #e95a0a 100%);
      box-shadow: 0 12px 24px rgba(255, 102, 0, 0.32), inset 0 1px 0 rgba(255, 222, 178, 0.32);
      cursor: pointer;
      transition: transform 0.15s ease, filter 0.15s ease;
    }

    .google-signin-btn:hover {
      transform: translateY(-1px);
      filter: brightness(1.03);
    }

    .google-signin-btn:active {
      transform: translateY(0);
      filter: brightness(0.96);
    }

    .google-signin-btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    /* ══════════════════════════════════════════
       REDUCED MOTION
       ══════════════════════════════════════════ */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
      }
    }
  </style>
</head>
<body>
  <div class="container landing">

    <div class="dragon-hero">
      <img src="/dragon-eyes.png" alt="Dragon eyes glowing in the darkness" />
    </div>

    <h1 class="app-title">LightWeight!</h1>
    <p class="subtitle">YEAH BUDDY!</p>
    <p class="tagline">Your fitness tracker</p>

    <div class="signin-box">
      <p>Continue with your Google account</p>
      <div id="google-btn" class="loading-msg">Loading...</div>
    </div>
  </div>

  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script>
    // Check if already signed in
    fetch("/api/auth/me")
      .then(function(res) {
        if (res.ok) return res.json();
        return null;
      })
      .then(function(profile) {
        if (profile) window.location.replace("/log.html");
      })
      .catch(function() {});

    var googleReady = false;

    // Load Google Client ID from server
    fetch("/api/auth/config")
      .then(function(res) { return res.json(); })
      .then(function(config) {
        if (!config.clientId) {
          document.getElementById("google-btn").innerHTML =
            '<p style="color:#e74c3c">Google Client ID not configured.<br>Set GOOGLE_CLIENT_ID env variable.</p>';
          return;
        }
        function initGoogle() {
          if (typeof google === "undefined" || !google.accounts) {
            setTimeout(initGoogle, 100);
            return;
          }
          google.accounts.id.initialize({
            client_id: config.clientId,
            callback: handleCredentialResponse,
            auto_select: false,
          });
          googleReady = true;
          document.getElementById("google-btn").innerHTML =
            '<button id="btn-google-custom" class="google-signin-btn" type="button">Continue with Google</button>';
          document.getElementById("btn-google-custom").addEventListener("click", function() {
            if (!googleReady) return;
            google.accounts.id.prompt();
          });
        }
        initGoogle();
      });

    function handleCredentialResponse(response) {
      fetch("/api/auth/google", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ credential: response.credential }),
      })
        .then(function(res) {
          if (res.ok) {
            window.location.href = "/log.html";
          } else {
            return res.json().then(function(data) {
              alert("Sign-in failed: " + (data.error || "Unknown error"));
            });
          }
        })
        .catch(function(err) {
          alert("Sign-in failed: " + err.message);
        });
    }
  </script>
</body>
</html>
