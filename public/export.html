<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LightWeight! — Export</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .export-wrap {
      max-width: 560px;
      margin: 0 auto;
    }

    .export-actions {
      display: grid;
      gap: 0.75rem;
      margin-top: 1rem;
    }

    .export-note {
      color: #aaa;
      font-size: 0.9rem;
      margin-top: 0.75rem;
    }

    .back-row {
      margin-top: 1rem;
      display: flex;
      justify-content: flex-start;
    }
  </style>
</head>
<body>
  <div class="container export-wrap">
    <header>
      <div>
        <h1>📥 Export Data</h1>
        <span class="back-link" id="user-info"></span>
      </div>
      <div class="header-actions">
        <button id="btn-back-top" class="btn btn-secondary btn-sm">← Back</button>
      </div>
    </header>

    <section class="card">
      <h2>Choose Format</h2>
      <div class="export-actions">
        <a href="/api/export?format=csv" class="btn btn-primary" download>Download CSV</a>
        <a href="/api/export?format=json" class="btn btn-secondary" download>Download JSON</a>
      </div>
      <p class="export-note">If your browser opens a file preview, use the back button below to return to the app.</p>
      <div class="back-row">
        <button id="btn-back-bottom" class="btn btn-secondary">← Back to App</button>
      </div>
    </section>
  </div>

  <script>
    (async function init() {
      let fallback = "/log.html";
      try {
        const res = await fetch("/api/auth/me");
        if (!res.ok) {
          window.location.replace("/");
          return;
        }
        const profile = await res.json();
        const userInfo = document.getElementById("user-info");
        if (userInfo) userInfo.textContent = profile.name;
      } catch {
        window.location.replace("/");
        return;
      }

      const params = new URLSearchParams(window.location.search);
      const from = params.get("from");
      if (from === "admin") fallback = "/admin.html";
      if (from === "recs") fallback = "/recommendations.html";

      const goBack = function() {
        window.location.href = fallback;
      };

      document.getElementById("btn-back-top").addEventListener("click", goBack);
      document.getElementById("btn-back-bottom").addEventListener("click", goBack);
    })();
  </script>
</body>
</html>
